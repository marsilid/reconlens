[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reconlens"
version = "0.1.0"
description = "Passive OSINT reconnaissance of a domain's external attack surface with an HTML risk report"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["osint", "reconnaissance", "security", "infosec", "dns", "tls", "attack-surface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "cryptography>=42",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
reconlens = "reconlens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reconlens"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
